name: Build Watcharr v3.0.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tag v3.0.1
        uses: actions/checkout@v4
        with:
          ref: 'v3.0.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend (Static)
        run: |
          npm install
          npm install -D @sveltejs/adapter-static
          
          # This command ensures 'fallback: index.html' is set in your config
          # This is critical for the Go server to serve the SPA correctly.
          sed -i "s/adapter: adapter(),/adapter: adapter({ fallback: 'index.html' }),/g" svelte.config.js
          
          npm run build
          
          # Prepare files for Go
          rm -rf server/ui
          mkdir -p server/ui
          cp -r build/* server/ui/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Compile Linux Binary
        run: |
          cd server
          export CGO_ENABLED=1
          # Go will now bake the static files into the executable
          go build -ldflags="-s -w" -o ../watcharr-v301 .

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: watcharr-linux-v3.0.1
          path: watcharr-v301
