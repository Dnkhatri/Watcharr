name: Build Watcharr v3.0.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tag v3.0.1
        uses: actions/checkout@v4
        with:
          ref: 'v3.0.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          npm install
          npm run build
          # CLEAN and move files to the exact folder Go looks at for embedding
          rm -rf server/ui
          mkdir -p server/ui
          cp -r build/* server/ui/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25' # Using the version that worked for you

      - name: Compile Linux Binary
        run: |
          cd server
          export CGO_ENABLED=1
          # We build from the server directory where the 'embed' logic lives
          go build -ldflags="-s -w" -o ../watcharr-v301 .

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: watcharr-linux-v3.0.1
          path: watcharr-v301
