name: Build Watcharr v3.0.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tag v3.0.1
        uses: actions/checkout@v4
        with:
          ref: 'v3.0.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          npm install
          npm run build
          mkdir -p server/ui
          cp -r build/* server/ui/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25' # Specific stable version

      - name: Compile Linux Binary
        run: |
          cd server
          # Force Go to use the locally installed version instead of downloading 1.25
          export GOTOOLCHAIN=local
          export CGO_ENABLED=1
          # Build the current directory package
          go build -ldflags="-s -w" -o ../watcharr-v301 .

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: watcharr-linux-v3.0.1
          path: watcharr-v301
